<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF5F1">
<title>工作台</title>
<style>
  /* ── Design Tokens ── */
  :root {
    --bg:#FAF5F1;
    --surface:#FFFFFF;
    --surface2:#F7F3ED;
    --border:#EFE9E0;
    --border-strong:#E2DAD0;
    --text:#2A2A32;
    --text2:#4E4E58;
    --text3:#7E7E88;
    --accent:#C4785A;
    --accent-light:#F9EDE6;
    --green:#3D8B52;
    --green-bg:#EDF5EE;
    --red:#C44444;
    --red-bg:#F9EFEF;
    --yellow:#9A7209;
    --yellow-bg:#F8F3E2;
    --blue:#3B7AB8;
    --blue-bg:#EDF3F9;
    --purple:#7B5EA7;
    --purple-bg:#F3F0F8;
    --teal:#3D8B7E;
    --teal-bg:#EBF4F2;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
    --shadow-hover:0 2px 4px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;-webkit-font-smoothing:antialiased}
  .hidden{display:none!important}

  /* ── Tab Bar ── */
  .tab-bar{display:flex;gap:6px;padding:14px 16px 4px}
  .tab-btn{flex:1;padding:9px 0;text-align:center;font-size:14px;font-weight:600;color:#8A8480;background:transparent;border:none;border-radius:10px;cursor:pointer;transition:all .2s}
  .tab-btn.active{color:var(--text);background:var(--surface);box-shadow:var(--shadow)}

  /* ── Header ── */
  .header{padding:16px 20px 8px}
  .header-date{font-size:30px;font-weight:800;letter-spacing:-.8px;color:var(--text)}
  .header-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .meta-tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--surface);color:var(--text2);border:1px solid var(--border)}
  .meta-tag.luck-good{color:var(--green);background:var(--green-bg);border-color:transparent}
  .meta-tag.element-tag{color:var(--accent);background:var(--accent-light);border-color:transparent}

  /* ── Quote ── */
  .quote-bar{padding:10px 20px 6px}
  .quote-text{font-size:14px;color:#5A5048;line-height:1.7;font-style:italic;padding-left:12px;border-left:3px solid var(--accent);border-radius:2px}
  .quote-source{font-size:11px;color:#8A8078;margin-top:4px;padding-left:15px}

  /* ── Cards ── */
  .card{background:var(--surface);border-radius:var(--radius);margin:8px 16px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--border)}
  .card-title{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.6px;margin-bottom:14px;text-transform:uppercase}

  /* ── Weather ── */
  .weather-hero{border-radius:var(--radius);margin:8px 16px;padding:14px 16px;position:relative;overflow:hidden}
  .wh-sunny{background:linear-gradient(135deg,#FDEBD0 0%,#FDF6E8 100%);color:#7A5C2E}
  .wh-cloudy{background:linear-gradient(135deg,#E6E4F0 0%,#F2F1F7 100%);color:#4E4E64}
  .wh-rainy{background:linear-gradient(135deg,#C8DCE8 0%,#E8F0F7 100%);color:#2E4A5E}
  .wh-snowy{background:linear-gradient(135deg,#E2E8F0 0%,#F0F4FA 100%);color:#3E5A72}
  .wh-default{background:linear-gradient(135deg,#EDE9E0 0%,#F7F5F0 100%);color:#5A5A64}
  .wh-inner{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
  .wh-icon{font-size:32px}
  .wh-info{flex:1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .wh-temp{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
  .wh-cond{font-size:14px;font-weight:600}
  .wh-range{font-size:12px;opacity:.65}
  .wh-tip{font-size:11px;opacity:.75;margin-top:6px;line-height:1.4;position:relative;z-index:1}
  .wh-deco{position:absolute;right:-14px;top:-14px;font-size:80px;opacity:.07;z-index:0;pointer-events:none}

  /* ── Palette ── */
  .palette{display:flex;gap:8px;margin-bottom:14px}
  .palette-row{display:flex;gap:8px;margin-bottom:0}
  .color-block{flex:1;border-radius:12px;padding:14px 10px;text-align:center;border:1px solid rgba(0,0,0,.08)}
  .color-block.primary{flex:1.6}
  .color-block .cb-name{font-size:14px;font-weight:700;line-height:1.3}
  .color-block .cb-status{font-size:12px;margin-top:4px;font-weight:600}
  .color-block .cb-relation{font-size:10px;margin-top:2px;font-weight:500}
  .avoid-block-wrap{flex:1;border:1.5px dashed rgba(0,0,0,.2);border-radius:12px;overflow:hidden;position:relative}
  .avoid-block-wrap::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.35);pointer-events:none}
  .avoid-block-wrap .color-block{border:none;border-radius:0;height:100%;position:relative;z-index:1;box-shadow:none}
  .avoid-label{text-align:center;font-size:11px;color:var(--red);margin:-8px 0 10px;letter-spacing:2px;font-weight:600}

  /* ── Recommendation ── */
  .rec-color-name{font-size:19px;font-weight:800;color:var(--accent);margin-bottom:6px}
  .rec-why{font-size:13px;color:var(--text2);line-height:1.8}
  .base-color-note{display:inline-block;font-size:12px;font-weight:600;padding:4px 12px;border-radius:8px;background:var(--surface2);color:var(--blue);margin-top:10px;border:1px solid var(--border)}

  /* ── Tinted Cards ── */
  .card-green{background:var(--green-bg);border-color:#D4E8D8}
  .card-blue{background:var(--blue-bg);border-color:#D0E2F0}
  .card-purple{background:var(--purple-bg);border-color:#DDD5EC}
  .card-teal{background:var(--teal-bg);border-color:#CCE8E2}
  .card-yellow{background:var(--yellow-bg);border-color:#E8E0C8}
  .card-green .card-title{color:#1B5E20}
  .card-blue .card-title{color:#0D47A1}
  .card-purple .card-title{color:#4A148C}
  .card-teal .card-title{color:#004D40}
  .card-yellow .card-title{color:#795548}
  .card-green .neutral-item{background:#fff;border-color:#D4E8D8}
  .card-teal .neutral-item{background:#fff;border-color:#CCE8E2}
  /* tinted card body text - high contrast saturated dark tones */
  .card-green .rec-why,.card-green .collapsible-title,.card-green .tip-row,.card-green .special-list li,.card-green .idea-list li{color:#1A4A2A}
  .card-teal .neutral-label{color:#0A5A50}
  .card-teal .neutral-reason{color:#0A5A50}
  .card-blue .tip-row,.card-blue .special-list li{color:#0D3D6E}
  .card-purple .review-summary,.card-purple .review-weather{color:#3D1E6E}
  .card-purple .review-tomorrow{background:#fff;border-color:#C4B5E0;color:#3D1E6E}
  .card-purple .review-tomorrow strong{color:#6B3FA0}
  .card-yellow .note-item{color:#6B4E12;border-color:#E0D5B8}
  .card-yellow .note-input{color:#6B4E12}
  .card-green .base-color-note{background:#fff;border-color:#C8E0CC;color:#0D5C3C}
  .card-green .chip{background:#fff;border-color:#C8E0CC;color:#1A4A2A}
  .card-green .collapsible-header{border-color:#C8E0CC}
  .card-green .pitfall-item{color:#B43434}
  .card-green .rec-color-name{color:#1B5E20}
  .card-green .avoid-label{color:#B43434}
  .card-green .collapsible-arrow{color:#4A7A5A}
  .card-green .color-block{border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.2)}
  .card-green .avoid-block-wrap{border:1.5px dashed rgba(180,52,52,.4);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* ── Collapsible ── */
  .collapsible-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:14px 0 10px;border-top:1px solid var(--border);margin-top:6px;user-select:none}
  .collapsible-title{font-size:14px;font-weight:700;color:var(--text)}
  .collapsible-arrow{font-size:11px;color:var(--text3);transition:transform .2s}
  .collapsible-content{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .collapsible-content.open{max-height:800px}
  .collapsible-header.open .collapsible-arrow{transform:rotate(90deg)}
  .idea-list{list-style:none;padding:2px 0 12px}
  .idea-list li{font-size:13px;color:var(--text2);line-height:1.7;padding:5px 0 5px 16px;position:relative}
  .idea-list li::before{content:"";position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.5}
  .inspiration-chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px}
  .chip{font-size:12px;padding:5px 12px;border-radius:8px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
  .pitfall-list{padding-bottom:12px}
  .pitfall-item{font-size:12px;color:var(--red);padding:4px 0 4px 20px;position:relative;opacity:.85}
  .pitfall-item::before{content:"⚠";position:absolute;left:0;font-size:11px}

  /* ── Neutral ── */
  .neutral-row{display:flex;gap:10px}
  .neutral-item{flex:1;background:var(--surface2);border-radius:12px;padding:14px;border:1px solid var(--border)}
  .neutral-label{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:6px}
  .neutral-status{font-size:20px;font-weight:800;margin-bottom:6px}
  .neutral-status.ok{color:var(--green)}.neutral-status.warn{color:var(--yellow)}.neutral-status.bad{color:var(--red)}
  .neutral-reason{font-size:11px;color:var(--text3);line-height:1.5}

  /* ── Tips ── */
  .tip-row{font-size:12px;color:var(--text2);line-height:1.7;padding:4px 0}
  .tip-row strong{color:var(--text)}

  /* ── Special ── */
  .special-list{list-style:none}
  .special-list li{font-size:12px;color:var(--text2);padding:4px 0 4px 16px;position:relative;line-height:1.6}
  .special-list li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.4}

  /* ── Review ── */
  .review-summary{font-size:14px;line-height:1.7;color:var(--text2)}
  .review-weather{font-size:12px;color:var(--text3);margin-top:8px}
  .review-tomorrow{margin-top:12px;padding:12px;background:var(--surface2);border-radius:10px;font-size:13px;color:var(--text2)}
  .review-tomorrow strong{color:var(--accent)}

  /* ── Notes ── */
  .notes-list{display:flex;flex-direction:column;gap:8px}
  .note-item{background:var(--surface2);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;cursor:pointer;position:relative;border:1px solid var(--border);color:var(--text2)}
  .note-item.pinned{border-color:var(--accent);background:var(--accent-light)}
  .note-item .note-pin{color:var(--accent);margin-right:4px}
  .note-item .note-delete{position:absolute;right:8px;top:8px;color:var(--text3);font-size:14px;padding:2px 6px;cursor:pointer}
  .note-input-row{display:flex;gap:8px;margin-top:12px}
  .note-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13px;outline:none}
  .note-input:focus{border-color:var(--accent)}
  .note-input::placeholder{color:var(--text3)}
  .btn-add{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer;font-weight:700}

  /* ── Weekly View ── */
  .week-summary{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:2px}
  .week-card{background:var(--surface);border-radius:14px;padding:14px 16px;margin:6px 16px;border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
  .week-card.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
  .week-card.past{opacity:.5}
  .week-card-header{display:flex;align-items:center;gap:12px}
  .week-color-dot{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
  .week-day-info{flex:1}
  .week-date{font-size:14px;font-weight:700;color:#3A3A42}
  .week-ganzhi{font-size:11px;color:#8A8490;margin-top:2px}
  .week-temp{font-size:12px;color:#8A8490;text-align:right;line-height:1.5}
  .week-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .week-detail.show{display:block}
  .week-colors{display:flex;gap:6px;margin-bottom:8px}
  .week-color-tag{flex:1;text-align:center;padding:7px 4px;border-radius:8px;font-size:11px;font-weight:700}
  .week-rec{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:6px}
  .week-neutral{font-size:11px;color:var(--text3);line-height:1.5}
  .week-adjust{margin-top:8px;font-size:11px;color:var(--yellow);background:var(--yellow-bg);padding:7px 10px;border-radius:8px}

  /* ── Monthly View ── */
  .month-summary{font-size:13px;color:var(--text2);line-height:1.7;margin:10px 16px 8px}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px}
  .month-weekday{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:4px 0}
  .month-cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);overflow:hidden;cursor:default;transition:box-shadow .15s}
  .month-cell:active{box-shadow:var(--shadow-hover)}
  .month-cell .mc-date{font-size:11px;font-weight:700;color:#4A4A52}
  .month-cell .mc-ganzhi{font-size:8px;color:#9A94A0;margin-top:1px}
  .month-cell .mc-color-bar{width:60%;height:3px;border-radius:2px;margin-top:3px}
  .month-cell.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .month-cell.today .mc-date{color:var(--accent)}
  .month-cell.past{opacity:.45}

  /* ── Footer ── */
  .footer{text-align:center;padding:24px 16px 32px;font-size:11px;color:var(--text3);line-height:1.8}
  .loading,.error-msg{text-align:center;padding:60px 20px;color:var(--text3)}
  .error-msg{color:var(--red)}
  .retry-btn{margin-top:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 22px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}
</style>
</head>
<body>

<div id="app"><div class="loading">加载中…</div></div>

<script>
const app = document.getElementById('app');
let DATA = {}, WEEKLY = null, MONTHLY = null;
let currentTab = 'today';

async function loadAll() {
  try {
    const [todayRes, weekRes, monthRes] = await Promise.all([
      fetch('data/today.json?t=' + Date.now()),
      fetch('data/weekly.json?t=' + Date.now()).catch(() => null),
      fetch('data/monthly.json?t=' + Date.now()).catch(() => null)
    ]);
    if (!todayRes.ok) throw new Error('数据文件加载失败');
    DATA = await todayRes.json();
    if (weekRes && weekRes.ok) WEEKLY = await weekRes.json();
    if (monthRes && monthRes.ok) MONTHLY = await monthRes.json();
    render();
  } catch(e) {
    app.innerHTML = `<div class="error-msg"><div>📭 ${e.message}</div><button class="retry-btn" onclick="loadAll()">重试</button></div>`;
  }
}

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toggle(h){h.classList.toggle('open');h.nextElementSibling.classList.toggle('open')}
function switchTab(tab){currentTab=tab;render()}

function render() {
  const o = DATA.outfit;
  if (!o) { app.innerHTML='<div class="error-msg">暂无今日数据</div>'; return; }

  let tabsHtml = `
    <div class="tab-bar">
      <div class="tab-btn ${currentTab==='today'?'active':''}" onclick="switchTab('today')">今日</div>
      <div class="tab-btn ${currentTab==='week'?'active':''}" onclick="switchTab('week')">本周</div>
      <div class="tab-btn ${currentTab==='month'?'active':''}" onclick="switchTab('month')">本月</div>
    </div>`;

  if (currentTab === 'today') { app.innerHTML = tabsHtml + renderToday(o, DATA); renderNotes(); }
  else if (currentTab === 'week') { app.innerHTML = tabsHtml + renderWeek(); }
  else { app.innerHTML = tabsHtml + renderMonth(); }
}

/* ── Weather helpers ── */
function weatherClass(cond) {
  if (!cond) return 'wh-default';
  if (cond.match(/雷|雨|阵雨|暴雨/)) return 'wh-rainy';
  if (cond.match(/雪/)) return 'wh-snowy';
  if (cond.match(/晴/)) return 'wh-sunny';
  if (cond.match(/云|阴|霾|雾/)) return 'wh-cloudy';
  return 'wh-default';
}

/* ── Today View ── */
function renderToday(o, data) {
  const r=o.recommendation||{}, n=o.neutral||{}, w=o.weather||{};
  const stCls=s=>s==='✅'?'ok':s==='⚠️'?'warn':'bad';

  let quoteHtml = '';
  if (data.quote?.text) {
    quoteHtml = `<div class="quote-bar">
      <div class="quote-text">${esc(data.quote.text)}</div>
      ${data.quote.source ? `<div class="quote-source">—— ${esc(data.quote.source)}</div>` : ''}
    </div>`;
  }

  let avoidBlocks='';
  if(o.colors.avoid?.length){
    avoidBlocks=`<div class="avoid-label">— 今日不宜 —</div><div class="palette">`+o.colors.avoid.map(a=>`
      <div class="avoid-block-wrap">
        <div class="color-block" style="background:${esc(a.hex)};color:${esc(a.text_hex)}">
          <div class="cb-name">${esc(a.name)}</div><div class="cb-status">${esc(a.element)}</div><div class="cb-relation">${esc(a.reason)}</div>
        </div>
      </div>`).join('')+`</div>`;
  }

  let ideas=r.outfit_ideas?.length?`
    <div class="collapsible-header" onclick="toggle(this)"><span class="collapsible-title">💡 搭配思路（三选一）</span><span class="collapsible-arrow">▶</span></div>
    <div class="collapsible-content"><ul class="idea-list">${r.outfit_ideas.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:'';

  let insp=r.inspiration?.length?`
    <div class="collapsible-header" onclick="toggle(this)"><span class="collapsible-title">🎨 配色灵感</span><span class="collapsible-arrow">▶</span></div>
    <div class="collapsible-content"><div class="inspiration-chips">${r.inspiration.map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div></div>`:'';

  let pit=r.pitfalls?.length?`
    <div class="collapsible-header" onclick="toggle(this)"><span class="collapsible-title">⚠️ 避坑提醒</span><span class="collapsible-arrow">▶</span></div>
    <div class="collapsible-content"><div class="pitfall-list">${r.pitfalls.map(p=>`<div class="pitfall-item">${esc(p)}</div>`).join('')}</div></div>`:'';

  let notes=o.special_notes?.length?`<ul class="special-list">${o.special_notes.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'';

  let review=data.review?`
    <div class="card card-purple"><div class="card-title">🌙 晚间复盘</div>
      <div class="review-summary">${esc(data.review.summary)}</div>
      ${data.review.weather_check?`<div class="review-weather">天气校验：${esc(data.review.weather_check.deviation)}</div>`:''}
      ${data.review.tomorrow_preview?`<div class="review-tomorrow">明日预告：<strong>${esc(data.review.tomorrow_preview.ganzhi)}·${esc(data.review.tomorrow_preview.element)}日</strong> ${esc(data.review.tomorrow_preview.main_color)}${data.review.tomorrow_preview.weather_note?`<br>${esc(data.review.tomorrow_preview.weather_note)}`:''}</div>`:''}
    </div>`:'';

  return `
  <div class="header">
    <div class="header-date">${esc(o.date)} ${esc(o.weekday)}</div>
    <div class="header-meta">
      <span class="meta-tag element-tag">${esc(o.ganzhi)} · ${esc(o.element)}日</span>
      <span class="meta-tag">${esc(o.chongsha)}</span>
      <span class="meta-tag luck-good">${esc(o.luck)}</span>
    </div>
  </div>
  ${quoteHtml}
  <div class="weather-hero ${weatherClass(w.condition)}">
    <div class="wh-deco">${esc(w.icon||'🌡')}</div>
    <div class="wh-inner">
      <div class="wh-icon">${esc(w.icon||'🌡')}</div>
      <div class="wh-info">
        <span class="wh-temp">${w.high ?? '—'}°</span>
        <span class="wh-cond">${esc(w.condition||'')}</span>
        <span class="wh-range">${w.low ?? '—'}~${w.high ?? '—'}°C · 武汉</span>
      </div>
    </div>
    ${w.tip?`<div class="wh-tip">💡 ${esc(w.tip)}</div>`:''}
  </div>
  <div class="card card-green"><div class="card-title">👗 今日穿搭 · ${esc(o.ganzhi)}${esc(o.element)}日</div>
    <div class="palette">
      <div class="color-block primary" style="background:${esc(o.colors.primary.hex)};color:${esc(o.colors.primary.text_hex)}">
        <div class="cb-name">${esc(o.colors.primary.name)}</div><div class="cb-status">${esc(o.colors.primary.status)}</div><div class="cb-relation">${esc(o.colors.primary.relation)}</div>
      </div>
      <div class="color-block" style="background:${esc(o.colors.secondary.hex)};color:${esc(o.colors.secondary.text_hex)}">
        <div class="cb-name">${esc(o.colors.secondary.name)}</div><div class="cb-status">${esc(o.colors.secondary.status)}</div><div class="cb-relation">${esc(o.colors.secondary.relation)}</div>
      </div>
    </div>${avoidBlocks}
    <div class="rec-color-name">🔥 推荐：${esc(r.color_name||'')}</div>
    <div class="rec-why">${esc(r.why||'')}</div>
    ${r.base_color?`<div class="base-color-note">基础色：${esc(r.base_color)}</div>`:''}
    ${ideas}${insp}${pit}
  </div>
  <div class="card card-teal"><div class="card-title">⚫ 黑 / 白 / 牛仔 · 当日影响</div>
    <div class="neutral-row">
      <div class="neutral-item"><div class="neutral-label">黑色/牛仔（水）</div><div class="neutral-status ${stCls(n.black_denim?.status)}">${esc(n.black_denim?.status||'—')}</div><div class="neutral-reason">${esc(n.black_denim?.reason||'')}</div></div>
      <div class="neutral-item"><div class="neutral-label">白色/银灰（金）</div><div class="neutral-status ${stCls(n.white_silver?.status)}">${esc(n.white_silver?.status||'—')}</div><div class="neutral-reason">${esc(n.white_silver?.reason||'')}</div></div>
    </div>
  </div>
  ${o.fabric_tip?`<div class="card card-blue"><div class="card-title">🧵 面料与场景</div><div class="tip-row"><strong>面料：</strong>${esc(o.fabric_tip)}</div>${o.scene_tip?`<div class="tip-row"><strong>场景：</strong>${esc(o.scene_tip)}</div>`:''}</div>`:''}
  ${notes?`<div class="card card-blue"><div class="card-title">📝 特别提醒</div>${notes}</div>`:''}
  ${review}
  <div class="card card-yellow"><div class="card-title">📌 快速便签</div>
    <div class="notes-list" id="notesList"></div>
    <div class="note-input-row"><input class="note-input" id="noteInput" placeholder="随手记…" onkeydown="if(event.key==='Enter')addNote()"><button class="btn-add" onclick="addNote()">＋</button></div>
    <div style="font-size:11px;color:var(--text3);margin-top:10px">便签保存在本设备 · 跨设备同步请告诉 AI 助手更新</div>
  </div>
  <div class="footer"><div>CClois 的个人工作台</div><div>数据更新：${esc(data.meta?.last_updated||'—')}</div></div>`;
}

/* ── Week View ── */
function renderWeek() {
  if (!WEEKLY?.week?.days?.length) return '<div class="loading">暂无本周数据</div>';
  const today = new Date().toISOString().slice(0,10);
  let h = `<div class="card" style="margin-top:8px"><div class="card-title">📅 ${esc(WEEKLY.week.start_date)} ~ ${esc(WEEKLY.week.end_date)}</div>
    <div class="week-summary">${esc(WEEKLY.week.summary||'')}</div></div>`;

  WEEKLY.week.days.forEach((d,i) => {
    const isToday = d.date === today;
    const isPast = d.date < today;
    h += `
    <div class="week-card ${isToday?'today':''} ${isPast?'past':''}" onclick="toggleWeek(${i})">
      <div class="week-card-header">
        <div class="week-color-dot" style="background:${esc(d.main_hex)};color:${esc(d.main_text_hex||'#fff')}">${esc(d.element)}</div>
        <div class="week-day-info">
          <div class="week-date">${esc(d.weekday)} ${esc(d.date?.slice(5))} ${isToday?'<span style="color:var(--accent);font-size:11px">← 今天</span>':''}</div>
          <div class="week-ganzhi">${esc(d.ganzhi)} · ${esc(d.element)}日</div>
        </div>
        <div class="week-temp">${d.weather?`${d.weather.low}-${d.weather.high}°`:''}<br>${d.weather?esc(d.weather.icon||''):''}</div>
      </div>
      <div class="week-detail" id="wd${i}">
        <div class="week-colors">
          <div class="week-color-tag" style="background:${esc(d.main_hex)};color:${esc(d.main_text_hex||'#fff')}">主 ${esc(d.main_color)}</div>
          <div class="week-color-tag" style="background:${esc(d.recommend_hex||d.main_hex)};color:#fff">推 ${esc(d.recommend)}</div>
        </div>
        <div class="week-rec">🔥 推荐：${esc(d.recommend)}</div>
        <div class="week-neutral">⚫ 黑/牛仔：${esc(d.black_denim||'—')}　⚪ 白/银：${esc(d.white_silver||'—')}　🚫 不宜：${esc(d.avoid||'')}</div>
        ${d.adjust?`<div class="week-adjust">📡 天气微调：${esc(d.adjust)}</div>`:''}
      </div>
    </div>`;
  });
  h += `<div class="footer"><div>数据更新：${esc(WEEKLY.meta?.last_updated||'—')}</div></div>`;
  return h;
}
function toggleWeek(i){document.getElementById('wd'+i)?.classList.toggle('show')}

/* ── Month View ── */
function renderMonth() {
  if (!MONTHLY?.days?.length) return '<div class="loading">暂无本月数据</div>';
  const today = new Date().toISOString().slice(0,10);
  const wds = ['一','二','三','四','五','六','日'];

  let h = `<div class="month-summary">${esc(MONTHLY.month_name||'')} · ${esc(MONTHLY.summary||'')}</div>`;
  h += '<div class="month-grid">';
  wds.forEach(w=>{h+=`<div class="month-weekday">${w}</div>`});

  const firstDow = new Date(MONTHLY.days[0].date+'T00:00:00').getDay();
  const pad = firstDow===0?6:firstDow-1;
  for(let i=0;i<pad;i++) h+='<div class="month-cell" style="visibility:hidden"></div>';

  MONTHLY.days.forEach(d=>{
    const isToday=d.date===today, isPast=d.date<today;
    h+=`<div class="month-cell ${isToday?'today':''} ${isPast?'past':''}" title="${esc(d.ganzhi)} ${esc(d.element)}日 · 推荐${esc(d.recommend)}">
      <div class="mc-date">${d.date?.slice(8)}</div>
      <div class="mc-ganzhi">${esc(d.ganzhi)}</div>
      <div class="mc-color-bar" style="background:${esc(d.color)}"></div>
    </div>`;
  });
  h+='</div>';
  h+=`<div class="footer"><div>色条=当日主色 · 点按看详情 · 数据更新：${esc(MONTHLY.meta?.last_updated||'—')}</div></div>`;
  return h;
}

/* ── Notes (localStorage) ── */
function getNotes(){try{return JSON.parse(localStorage.getItem('wb_notes')||'[]')}catch{return[]}}
function saveNotes(n){localStorage.setItem('wb_notes',JSON.stringify(n))}
function renderNotes(){
  const l=document.getElementById('notesList');if(!l)return;
  const ns=getNotes();if(!ns.length){l.innerHTML='';return}
  l.innerHTML=ns.map((n,i)=>`<div class="note-item ${n.pinned?'pinned':''}">${n.pinned?'<span class="note-pin">📌</span>':''}${esc(n.text)}<span class="note-delete" onclick="deleteNote(${i})">✕</span></div>`).join('');
}
function addNote(){
  const inp=document.getElementById('noteInput'),t=inp.value.trim();if(!t)return;
  const ns=getNotes();ns.unshift({text:t,pinned:false,created:new Date().toISOString()});
  saveNotes(ns);inp.value='';renderNotes();
}
function deleteNote(i){const ns=getNotes();ns.splice(i,1);saveNotes(ns);renderNotes()}

loadAll();
</script>
